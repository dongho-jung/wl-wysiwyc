<!doctype html>
<meta charset="utf-8">
<title>wl-wysiwyc navigation test</title>
<style>
 * { box-sizing: border-box }
 body { font: 13px system-ui, sans-serif; margin: 0; color: #222 }
 a { color: #06c; text-decoration: none }
 h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 16px 0 6px }
 .bar { position: sticky; top: 0; background: #23262e; padding: 5px 8px; display: flex; gap: 3px; z-index: 5 }
 .bar a { color: #dde; border: 1px solid #444; border-radius: 3px; padding: 2px 6px; font-size: 11px }
 .page { display: flex; align-items: flex-start }
 .side { width: 178px; padding: 8px; border-right: 1px solid #e2e2e2; position: sticky; top: 30px }
 .side a { display: block; padding: 4px 6px; border-radius: 4px }
 .side a:nth-child(3n) { padding-left: 20px }
 .main { flex: 1; padding: 8px 14px; min-width: 0 }
 .rail { width: 150px; padding: 8px; border-left: 1px solid #e2e2e2 }
 .rail a { display: block; margin: 14px 0 }
 .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
 .card { border: 1px solid #ddd; border-radius: 6px; padding: 8px }
 .card .row { display: flex; gap: 5px; margin-top: 6px; align-items: center }
 .card a.btn { border: 1px solid #bbb; border-radius: 4px; padding: 3px 8px }
 .card a.x { border: 1px solid #eee; padding: 1px 3px; font-size: 10px }
 form { display: grid; grid-template-columns: 92px 1fr 92px 1fr; gap: 7px 10px; align-items: center; max-width: 780px }
 input, select { padding: 3px 5px; border: 1px solid #ccc; border-radius: 3px; width: 100% }
 .wide { grid-column: 2 / 5 }
 table { border-collapse: collapse; font-size: 12px } td, th { border: 1px solid #e4e4e4; padding: 2px 7px }
 .chips a { display: inline-block; border: 1px solid #ccd; border-radius: 11px; padding: 2px 9px; margin: 2px }
 .icons a { display: inline-block; width: 17px; height: 17px; border: 1px solid #ccc; margin: 1px; vertical-align: top }
 .spread a { display: inline-block; border: 1px solid #999; border-radius: 5px; padding: 20px 40px; margin: 30px 70px }
 .prose { max-width: 560px; line-height: 1.85 }
 .float { position: fixed; right: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 8px }
 .float a { background: #06c; color: #fff; border-radius: 20px; padding: 9px 15px }
 .scroller { overflow-x: auto; white-space: nowrap; border: 1px solid #eee; padding: 5px }
 .scroller a { display: inline-block; border: 1px solid #ddd; padding: 9px 22px; margin-right: 5px }
 .pager a { display: inline-block; border: 1px solid #ccc; padding: 2px 7px; margin-right: 2px }
 .stack { position: relative; height: 84px } .stack a { position: absolute; border: 1px solid #bbb; background: #fff; padding: 4px 9px }
</style>
<div class="bar"><script>for(let i=0;i<22;i++)document.write(`<a href=#b${i}>b${i}</a>`)</script></div>
<div class="page">
  <nav class="side"><script>
    const nav=['Overview','Activity','Reports','Insights','Members','Teams','Roles','Access','Billing','Invoices','Usage','Limits','Webhooks','Keys','Audit','Events','Alerts','Rules','Backups','Regions','Support','Docs','Status','Labs','Settings'];
    nav.forEach((n,i)=>document.write(`<a href=#n${i}>${n}</a>`))
  </script></nav>
  <div class="main">
    <h3>cards: buttons of different sizes inside boxes</h3>
    <div class="cards"><script>
      for(let i=0;i<9;i++) document.write(`<div class=card><a href=#ct${i}>Card title ${i}</a>
        <div class=row><a class=btn href=#ca${i}>Open</a><a class=btn href=#cb${i}>Retry</a><a class=x href=#cx${i}>x</a><a class=x href=#cy${i}>...</a></div></div>`)
    </script></div>
    <h3>form: two columns, irregular rhythm</h3>
    <form><script>
      const f=['Name','Region','Owner','Plan','Contact','Tier','Domain','Quota'];
      f.forEach((n,i)=>document.write(`<label for=f${i}><a href=#f${i}>${n}</a></label><input id=f${i} value="${n.toLowerCase()}">`));
      document.write('<label><a href=#fw>Notes</a></label><input class=wide value="a wider one">')
    </script></form>
    <h3>prose: links inside running text</h3>
    <p class="prose"><script>
      const w='the quick brown fox jumps over a lazy dog while the compositor hands out labels and the pointer drifts between them looking for something to click on before the page changes again'.split(' ');
      w.forEach((x,i)=> document.write(i%4==1 ? `<a href=#p${i}>${x}</a> ` : x+' '))
    </script></p>
    <h3>table: wide, dense</h3>
    <table><script>
      document.write('<tr>'); for(let c=0;c<9;c++) document.write(`<th><a href=#h${c}>col ${c}</a></th>`); document.write('</tr>');
      for(let r=0;r<10;r++){ document.write('<tr>'); for(let c=0;c<9;c++) document.write(`<td><a href=#t${r}_${c}>${r}.${c}</a></td>`); document.write('</tr>') }
    </script></table>
    <div class="pager"><script>for(let i=1;i<=12;i++)document.write(`<a href=#pg${i}>${i}</a>`)</script></div>
    <h3>chips that wrap</h3>
    <div class="chips"><script>
      const c=['alpha','beta','gamma','delta','epsilon','zeta','eta','theta','iota','kappa','lambda','mu','nu','xi','omicron','pi','rho','sigma','tau','upsilon','phi','chi','psi','omega'];
      c.forEach((n,i)=>document.write(`<a href=#ch${i}>${n}</a>`))
    </script></div>
    <h3>a tight cluster of tiny icons</h3>
    <div class="icons"><script>for(let i=0;i<40;i++)document.write(`<a href=#i${i}></a>`)</script></div>
    <h3>overlapping, absolutely placed</h3>
    <div class="stack"><script>
      for(let i=0;i<7;i++) document.write(`<a style="left:${i*46}px; top:${(i%3)*22}px" href=#o${i}>ov ${i}</a>`)
    </script></div>
    <h3>a horizontal scroller</h3>
    <div class="scroller"><script>for(let i=0;i<20;i++)document.write(`<a href=#hs${i}>wide item ${i}</a>`)</script></div>
    <h3>far apart</h3>
    <div class="spread"><script>for(let i=0;i<4;i++)document.write(`<a href=#sp${i}>spread ${i}</a>`)</script></div>
  </div>
  <aside class="rail"><script>for(let i=0;i<8;i++)document.write(`<a href=#w${i}>widget link ${i}</a>`)</script></aside>
</div>
<div class="float"><a href=#fa>Compose</a><a href=#fb>Help</a></div>
